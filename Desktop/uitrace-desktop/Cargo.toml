[package]
name = "uitrace-desktop"
version = "0.1.0"
edition = "2021"
authors = ["UITrace Team"]
description = "UITrace Desktop Client - UI Automation Testing Platform"
license = "MIT"
repository = "https://github.com/uitrace/uitrace"

[dependencies]
# Tauri dependencies
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-build = { version = "2.0.0", features = [] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-os = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-store = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-http = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebDriver and browser automation
thirtyfour = "0.34"
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File operations
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Image processing for visual testing
image = "0.24"
image-compare = "0.3"
base64 = "0.21"

# Data processing
csv = "1.3"
calamine = "0.22"  # Excel file support

# HTTP client
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Configuration
config = "0.14"
dirs = "5.0"
toml = "0.8"

# Additional dependencies for missing modules
url = "2.5"
tokio-util = "0.7"
tracing-appender = "0.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
