# Clippy configuration for Rust linting

# Deny certain lints that are important for this project
deny = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::nursery",
    "clippy::cargo",
]

# Allow some lints that are not critical
allow = [
    "clippy::module_name_repetitions",
    "clippy::missing_errors_doc",
    "clippy::missing_panics_doc",
    "clippy::similar_names",
    "clippy::too_many_lines",
    "clippy::struct_excessive_bools",
    "clippy::fn_params_excessive_bools",
]

# Configure warning levels for specific lints
warn = [
    "clippy::wildcard_dependencies",
    "clippy::redundant_feature_names",
    "clippy::negative_feature_names",
]

# Configure complexity thresholds
cognitive-complexity-threshold = 30
too-many-arguments-threshold = 7
type-complexity-threshold = 250