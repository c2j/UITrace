[package]
name = "uitrace-desktop"
version = "0.1.0"
description = "UITrace Desktop Client - UI Automation Testing Platform"
authors = [ "UITrace Team" ]
license = "MIT"
edition = "2021"

[lib]
name = "uitrace_desktop_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.1.0"
features = [ ]

[dependencies]
tauri-plugin-shell = "2.1.0"
tauri-plugin-notification = "2.1.0"
tauri-plugin-os = "2.1.0"
tauri-plugin-fs = "2.1.0"
tauri-plugin-store = "2.1.0"
tauri-plugin-http = "2.1.0"
serde_json = "1"

[dependencies.tauri]
version = "2.1.0"
features = [
  "tray-icon",
  "protocol-asset"
]

[dependencies.serde]
version = "1"
features = [ "derive" ]
