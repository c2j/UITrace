[package]
name = "uitrace-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tauri dependencies
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-shell = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

# WebDriver automation
thirtyfour = "0.31"

# Visual comparison
image = "0.24"
image-compare = "0.4"

# Async utilities
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# CSV parsing
csv = "1.3"
calamine = "0.24"

# Regex for variable substitution
regex = "1.10"

# Random number generation
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
