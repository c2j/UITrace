[package]
name = "uitrace-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
# Tauri dependencies
tauri = { version = "2.0", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

# WebDriver automation
thirtyfour = "0.31"

# Visual comparison
image = "0.24"
image-compare = "0.4"

# Async utilities
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
