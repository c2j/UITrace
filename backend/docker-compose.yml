version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: uitrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uitrace
      POSTGRES_USER: uitrace
      POSTGRES_PASSWORD: uitrace123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uitrace -d uitrace"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: uitrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: uitrace-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-setup:
    image: minio/mc:latest
    container_name: uitrace-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/uitrace-screenshots;
      /usr/bin/mc mb myminio/uitrace-baselines;
      /usr/bin/mc mb myminio/uitrace-diffs;
      /usr/bin/mc mb myminio/uitrace-traces;
      /usr/bin/mc anonymous set public myminio/uitrace-screenshots;
      /usr/bin/mc anonymous set public myminio/uitrace-diffs;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: