version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: uitrace-postgres
    environment:
      POSTGRES_DB: uitrace
      POSTGRES_USER: uitrace
      POSTGRES_PASSWORD: uitrace123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uitrace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uitrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: uitrace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - uitrace-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UITrace Server
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: uitrace-server
    environment:
      - DATABASE_URL=postgresql://uitrace:uitrace123@postgres:5432/uitrace
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-here-change-in-production
      - DEBUG=True
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uitrace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Selenium Grid Hub
  selenium-hub:
    image: selenium/hub:4.15.0
    container_name: uitrace-selenium-hub
    ports:
      - "4444:4444"
    environment:
      - GRID_MAX_SESSION=16
      - GRID_BROWSER_TIMEOUT=300
      - GRID_TIMEOUT=300
    networks:
      - uitrace-network

  # Chrome Node
  chrome-node:
    image: selenium/node-chrome:4.15.0
    container_name: uitrace-chrome-node
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - HUB_PORT=4444
      - NODE_MAX_SESSION=4
      - NODE_MAX_INSTANCES=4
    networks:
      - uitrace-network

  # Firefox Node
  firefox-node:
    image: selenium/node-firefox:4.15.0
    container_name: uitrace-firefox-node
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - HUB_PORT=4444
      - NODE_MAX_SESSION=4
      - NODE_MAX_INSTANCES=4
    networks:
      - uitrace-network

volumes:
  postgres_data:
  redis_data:

networks:
  uitrace-network:
    driver: bridge