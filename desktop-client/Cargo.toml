[package]
name = "uitrace-client"
version = "0.1.0"
description = "UITrace Desktop Client"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
regex = "1.0"
thirtyfour = "0.31"
once_cell = "1.19"
